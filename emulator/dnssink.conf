# Sinkhole DNS policy for the firmware VM. Lines: "SUFFIX IP".
# A names under these suffixes resolve to the in-guest sandbox; everything
# else returns NXDOMAIN (and is logged to /var/log/dns_queries.log).
# Point at 10.0.2.2 instead of 127.0.0.1 to drive the API from the host stack.
.emaldo.com 127.0.0.1
emaldo.com 127.0.0.1
# connectivity probes the firmware's netmonitor uses to judge "internet up"
# (measured in /var/log/dns_queries.log); they must resolve locally or the app
# never starts its cloud stage. portal204.py answers the HTTP side,
# sandbox_api.py answers /generate_204 on the TLS side.
cp.cloudflare.com 127.0.0.1
clients3.google.com 127.0.0.1
connectivitycheck.gstatic.com 127.0.0.1
www.google.com 127.0.0.1
detectportal.firefox.com 127.0.0.1
