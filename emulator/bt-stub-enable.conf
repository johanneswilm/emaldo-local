# Install as /etc/systemd/system/multi-user.target.d/bt-stub.conf
# Enable bt-stub.service without touching multi-user.target.wants: systemd
# IGNORES non-symlink entries there ("Wants dependency dropin ... is not a
# symlink, ignoring") and debugfs `symlink` refuses if the name exists, so a
# Wants= drop-in on the target is the reproducible way (verified: hci0 UP at
# up=110, attempt 1, and no BT reload escalation).
[Unit]
Wants=bt-stub.service
After=bt-stub.service
