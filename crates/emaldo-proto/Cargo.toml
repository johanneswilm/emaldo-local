[package]
name = "emaldo-proto"
description = "Emaldo vendor wire protocol: REST envelopes, MSCT/E2E frames, command codecs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
rc4 = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
