[package]
name = "emaldo-bridge"
description = "Local-first cloud bridge for the Emaldo Power Core: vendor REST + E2E relay + web UI on the battery"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
emaldo-proto = { path = "../emaldo-proto" }
pbkdf2 = "0.12"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
rustls-pemfile = "2"
rustls-rustcrypto = "0.1.0-pre.0"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["local-offset", "formatting", "parsing"] }

[dev-dependencies]
